name: Bug report
description: Report something that doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      placeholder: Video freezes a few seconds into a call.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat
        2. Tap call, then Video call
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Light Phone III
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `adb logcat -s WaPoc`, if you can get it. Remove phone numbers first.
      render: text
